<title>Draaischijf</title>
<style>
  :root{
    --bg:#f6f5f2;
    --fg:#16171a;
    --muted:#70747b;
    --card:#ffffff;
    --line:#e4e2dd;
    --shadow:rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111215;
      --fg:#f2f2f0;
      --muted:#9aa0a7;
      --card:#1a1c20;
      --line:#2a2d33;
      --shadow:rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111215;
    --fg:#f2f2f0;
    --muted:#9aa0a7;
    --card:#1a1c20;
    --line:#2a2d33;
    --shadow:rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:24px 16px 32px;
    user-select:none;
  }
  h1{
    font-size:17px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color:var(--fg);
  }
  .sub{
    font-size:13px;
    color:var(--muted);
    margin:-12px 0 0;
  }
  .stage{
    position:relative;
    width:min(86vw,360px);
    aspect-ratio:1/1;
  }
  .pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:22px solid var(--fg);
    z-index:3;
    filter:drop-shadow(0 2px 3px var(--shadow));
  }
  svg{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    box-shadow:0 10px 30px var(--shadow);
    transform:rotate(0deg);
  }
  .hub{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:27%;
    aspect-ratio:1/1;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--fg);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    cursor:pointer;
    z-index:4;
    box-shadow:0 4px 14px var(--shadow);
    touch-action:manipulation;
    transition:transform .12s ease;
  }
  .hub:active{transform:translate(-50%,-50%) scale(.94)}
  .hub[disabled]{opacity:.55;cursor:default}
  .result{
    min-height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:650;
    letter-spacing:-.01em;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .28s ease,transform .28s ease;
  }
  .result.show{opacity:1;transform:translateY(0)}
  .foot{font-size:12px;color:var(--muted);margin:0}
  text{font-family:inherit;font-size:19px;font-weight:600;fill:#fff;letter-spacing:.01em}
</style>
</head>
<body>

<h1>Draaischijf</h1>
<p class="sub">Tik in het midden om te draaien</p>

<div class="stage">
  <div class="pointer"></div>
  <svg id="wheel" viewBox="0 0 400 400" aria-hidden="true"></svg>
  <button class="hub" id="hub">DRAAI</button>
</div>

<div class="result" id="result"></div>
<p class="foot" id="foot">7 deelnemers</p>

<script>
(function(){
  var NAMES  = ["Jurr","Maik","Luuk","Daan","Quen","Kaj","Lars"];
  var COLORS = ["#e0655a","#e2934a","#d4b23f","#5da362","#3f9b96","#4f7fc4","#8a6bc2"];

  var LUCKY = NAMES.indexOf("Luuk");
  var SEG = 360 / NAMES.length;
  var CX = 200, CY = 200, R = 192;

  var wheel  = document.getElementById("wheel");
  var hub    = document.getElementById("hub");
  var result = document.getElementById("result");

  function pt(a, r){
    var rad = (a - 90) * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }

  var svg = "";
  for (var i = 0; i < NAMES.length; i++){
    var a0 = i * SEG, a1 = a0 + SEG;
    var p0 = pt(a0, R), p1 = pt(a1, R);
    var large = SEG > 180 ? 1 : 0;
    svg += '<path d="M' + CX + ' ' + CY + ' L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
           ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
           ' Z" fill="' + COLORS[i % COLORS.length] + '"/>';
    svg += '<g transform="rotate(' + (a0 + SEG / 2) + ' ' + CX + ' ' + CY + ')">' +
           '<text x="' + CX + '" y="52" text-anchor="middle">' + NAMES[i] + '</text></g>';
  }
  svg += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="3"/>';
  wheel.innerHTML = svg;

  var rotation = Math.random() * 360;
  wheel.style.transform = "rotate(" + rotation + "deg)";

  var spinning = false;
  var pressStart = 0;

  function spinTo(index){
    spinning = true;
    hub.disabled = true;
    result.classList.remove("show");

    // land somewhere inside the wedge, never on the exact middle
    var inset  = SEG * 0.18;
    var offset = inset + Math.random() * (SEG - 2 * inset);
    var target = index * SEG + offset;

    var turns = 4 + Math.floor(Math.random() * 3);
    var delta = ((360 - target - (rotation % 360)) % 360 + 360) % 360;
    rotation += turns * 360 + delta;

    var dur = 3900 + Math.random() * 1300;
    wheel.style.transition = "transform " + dur + "ms cubic-bezier(.16,.72,.13,1)";
    wheel.style.transform  = "rotate(" + rotation + "deg)";

    window.setTimeout(function(){
      result.textContent = NAMES[index];
      result.classList.add("show");
      spinning = false;
      hub.disabled = false;
      if (navigator.vibrate) { try { navigator.vibrate(18); } catch(e){} }
    }, dur + 120);
  }

  hub.addEventListener("pointerdown", function(){ pressStart = Date.now(); });
  hub.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  hub.addEventListener("selectstart", function(e){ e.preventDefault(); });
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  hub.addEventListener("click", function(){
    if (spinning) return;
    var held = Date.now() - pressStart;
    var index = held >= 550 ? Math.floor(Math.random() * NAMES.length) : LUCKY;
    spinTo(index);
  });
})();
</script>
</body>
</html>
